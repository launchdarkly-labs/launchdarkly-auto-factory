# Service registry for Beacon (Phase 2).
#
# NOTE: the entries below are the AUTHOR'S DEMO ESTATE (Railway-hosted demo
# services), committed as a worked example of the shape. A real deployment
# replaces them all with its own services; nothing else reads this file.
#
# Each deployable service maps to a scope "side" (frontend/backend), the repo
# its code + `.release-flags/` live in, and a status endpoint that reports the
# service's currently-deployed SHA (used for fullstack cross-service checks).
#
# Keys must match the service name a deploy notification carries — for the
# Railway adapter that's the Railway service name verbatim.
#
# This generalizes the reference (which hardcoded specific service names).

services:
  demo-frontend:
    side: frontend
    repo: ttotenberg-ld/launchdarkly-autofactory-demo
    statusUrl: https://demo-frontend-production-a9a3.up.railway.app/api/status
    statusShaField: version         # JSON field on the status response holding the deployed SHA

  demo-backend:
    side: backend
    repo: ttotenberg-ld/launchdarkly-autofactory-demo
    statusUrl: https://demo-backend-production-0173.up.railway.app/api/status
    statusShaField: version

  # --- ToggleMart (launchdarkly-autofactory-application) ---
  # Railway service names verbatim (the Railway adapter matches on them).
  # catalog/orders/users are private-network-only: their statusUrls are
  # unreachable from Beacon and exist for completeness — the fullstack
  # cross-check skips unreachable counterparts and uses frontend/gateway,
  # which have public domains.
  togglemart-frontend:
    side: frontend
    repo: ttotenberg-ld/launchdarkly-autofactory-application
    statusUrl: https://togglemart-frontend-production.up.railway.app/api/status
    statusShaField: version

  togglemart-gateway:
    side: backend
    repo: ttotenberg-ld/launchdarkly-autofactory-application
    statusUrl: https://togglemart-gateway-production.up.railway.app/api/status
    statusShaField: version

  togglemart-catalog:
    side: backend
    repo: ttotenberg-ld/launchdarkly-autofactory-application
    statusUrl: http://togglemart-catalog.railway.internal:8081/api/status
    statusShaField: version

  togglemart-orders:
    side: backend
    repo: ttotenberg-ld/launchdarkly-autofactory-application
    statusUrl: http://togglemart-orders.railway.internal:8082/api/status
    statusShaField: version

  togglemart-users:
    side: backend
    repo: ttotenberg-ld/launchdarkly-autofactory-application
    statusUrl: http://togglemart-users.railway.internal:8083/api/status
    statusShaField: version
