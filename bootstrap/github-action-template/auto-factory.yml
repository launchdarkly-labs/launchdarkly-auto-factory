# Drop this into your app repo at .github/workflows/auto-factory.yml
#
# Phase 1 is OPT-IN via the PR label `autofactory` — intended for user-created
# new features, not every PR (docs, chores, bugfixes behind an existing flag).
# Add the label when opening/updating a feature PR (or when you want the chain
# to run). Bugfixes and unlabeled PRs skip the job.
#
# The agent chain runs on the Anthropic API by default. The
# auto-factory-ai-provider flag in the factory project selects the backend; it
# is optional and defaults to "anthropic" when absent. With flag creation and
# code changes enabled, the agents create a real flag (targeting off), wire it
# into the code, instrument metrics, add tests, and push to the PR branch.
#
# Per-step approval gates (optional): the auto-factory-approval-gates flag (an
# array of agent node keys) pauses the chain before those steps. The run halts
# and comments which label to add (af-approve:<step>); the `labeled` trigger
# below makes adding that label re-run the chain so it proceeds past the gate
# (keep the `autofactory` label on the PR so the job still matches).
#
# Providers: this drop-in form works for the 'anthropic' (default) and 'vega'
# backends. The 'cursor' backend can't run here — its @cursor/sdk dependency needs
# node_modules, which a bare `uses:` action doesn't have. To run 'cursor', use the
# checkout + `npm ci` + run-the-bundle workflow variant and add the cursor_api_key.

name: LaunchDarkly Auto-Factory

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write        # agents commit flag wiring, metrics, and tests to the PR branch
  pull-requests: write   # post the summary comment
  checks: write          # post the approval-gate status as a check run

jobs:
  auto-factory:
    runs-on: ubuntu-latest
    # Opt-in: require the `autofactory` label (new features). Also skip the
    # CI-loop bot actor. Primary loop guard is still `[skip ci]` on agent commits.
    if: |
      github.actor != 'github-actions[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'autofactory')
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR's head branch (not the detached merge ref) so the
          # agents can commit and push back to the PR.
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      # Optional: the knowledge graph (auto-factory-knowledge-graph flag) uses
      # ld-find-code-refs at the PR SHA for flag→code wrap-point edges. Without
      # the binary the run still succeeds — it just warns and skips that source.
      - name: Install ld-find-code-refs (knowledge-graph wrap points)
        continue-on-error: true
        run: |
          curl -fsSL https://github.com/launchdarkly/ld-find-code-refs/releases/download/v2.14.0/ld-find-code-refs_2.14.0_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin ld-find-code-refs

      - name: LaunchDarkly Auto-Factory Phase 1
        # Replace <owner> with the org or user hosting the auto-factory repo.
        uses: <owner>/launchdarkly-auto-factory/packages/phase1-resource-factory@main
        with:
          ld_sdk_key: ${{ secrets.LD_SDK_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          ld_app_project_key: ${{ vars.LD_APP_PROJECT_KEY }}   # e.g. autofactory-demo
          ld_api_key: ${{ secrets.LD_API_KEY }}
          enable_flag_creation: "true"   # create real flags/metrics in the app project
          enable_code_changes: "true"    # commit wiring + tests to the PR branch
          pr_branch: ${{ github.event.pull_request.head.ref }}
          pr_base: ${{ github.event.pull_request.base.ref }}
          graph_key: gha-auto-factory
          # Approvals are controlled by the auto-factory-approval-mode /
          # -risk-threshold / -approval-gates flags in the factory project.
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # Optional: token able to read PRIVATE repos registered under relatedRepos
          # in .autofactory/services.yaml (cross-repo research). GITHUB_TOKEN covers
          # public/same-repo reads without this.
          AUTOFACTORY_REPOS_TOKEN: ${{ secrets.AUTOFACTORY_REPOS_TOKEN }}
